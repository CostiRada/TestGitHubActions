name: Build Advanced Installer Project (.AIP)  Demo
on: [workflow_dispatch]
env:
  advancedinstaller_url: 'https://www.advancedinstaller.com/downloads/advinst-costi-test.msi'
permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required to checkout code
jobs:
  advinst-aip-build-demo:
    runs-on: windows-latest
    environment: abcd
    name: Test Azure Key Vault
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Test Background CLI Token Fetch
        run: |
          az account get-access-token --resource "https://vault.azure.net" --tenant ${{ vars.AZURE_TENANT_ID }}
      - name: Build AIP
        uses: caphyon/advinst-github-action@main
        with:
          advinst-version: '22.0'
          advinst-license: ${{ secrets.ADVINST_LICENSE_KEY }}
          advinst-enable-automation: 'true'
          aip-path: ${{ github.workspace }}\Your ApplicationAzure.aip
          aip-build-name: DefaultBuild
          aip-package-name: setup.msi
          aip-output-dir:  ${{ github.workspace }}\setup
          aip-commands: |
            SetProperty FOO="foo"
            SetVersion 1.2.0
      - name: Publish setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup
          path: ${{ github.workspace }}\setup\setup.msi
